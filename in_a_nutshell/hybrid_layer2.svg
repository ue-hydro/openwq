<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="The closure chain: inputs to a small network g, squashed by tanh to minus one to one, scaled by alpha, clamped to plus or minus max, giving one plus correction, which multiplies the physics flux to give the corrected flux.">
  <defs>
    <marker id="l2ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2430"/></marker>
  </defs>
  <rect x="1" y="1" width="1078" height="298" rx="14" fill="#f7f8fa" stroke="#d7dde5"/>
  <text x="527" y="24" text-anchor="middle" letter-spacing="1" font-size="12" font-weight="600" fill="#c2650a">the correction is bounded at every step</text>
  <rect x="16"  y="42" width="150" height="46" rx="9" fill="#eef1f6" stroke="#d7dde5" stroke-width="1.5"/><text x="91"  y="70" text-anchor="middle" font-size="12.5" fill="#1c2430">state, attr</text>
  <rect x="212" y="42" width="104" height="46" rx="9" fill="#fbeeda" stroke="#c2650a" stroke-width="2"/><text x="264" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2430">g = NN</text>
  <rect x="362" y="42" width="132" height="46" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1.5"/><text x="428" y="65" text-anchor="middle" font-size="12.5" fill="#1c2430">tanh</text><text x="428" y="80" text-anchor="middle" font-size="10.5" fill="#5d6875">→ [−1, 1]</text>
  <rect x="540" y="42" width="86"  height="46" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1.5"/><text x="583" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2430">× α</text>
  <rect x="672" y="42" width="132" height="46" rx="9" fill="#ffffff" stroke="#d7dde5" stroke-width="1.5"/><text x="738" y="65" text-anchor="middle" font-size="12.5" fill="#1c2430">clamp</text><text x="738" y="80" text-anchor="middle" font-size="10.5" fill="#5d6875">± max_corr</text>
  <rect x="850" y="42" width="120" height="46" rx="9" fill="#fbeeda" stroke="#c2650a" stroke-width="2"/><text x="910" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#1c2430">1 + corr</text>
  <line x1="166" y1="65" x2="208" y2="65" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/>
  <line x1="316" y1="65" x2="358" y2="65" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/><text x="337" y="36" text-anchor="middle" font-size="10.5" fill="#5d6875">raw</text>
  <line x1="494" y1="65" x2="536" y2="65" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/>
  <line x1="626" y1="65" x2="668" y2="65" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/><text x="647" y="36" text-anchor="middle" font-size="10.5" fill="#5d6875">α·g</text>
  <line x1="804" y1="65" x2="846" y2="65" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/>
  <text x="583" y="112" text-anchor="middle" font-size="11" fill="#5d6875">dial α: 0 = physics · 1 = full</text>
  <rect x="212" y="196" width="150" height="46" rx="9" fill="#e3f2ef" stroke="#0f766e" stroke-width="2"/><text x="287" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2430">Φ  physics flux</text>
  <circle cx="910" cy="219" r="21" fill="#fbeeda" stroke="#c2650a" stroke-width="2"/><text x="910" y="224" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2430">×</text>
  <rect x="992" y="196" width="72" height="46" rx="9" fill="#eef1f6" stroke="#d7dde5" stroke-width="1.5"/><text x="1028" y="218" text-anchor="middle" font-size="11" fill="#1c2430">corr.</text><text x="1028" y="232" text-anchor="middle" font-size="11" fill="#1c2430">flux</text>
  <line x1="362" y1="219" x2="887" y2="219" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/><text x="600" y="212" text-anchor="middle" font-size="12" fill="#5d6875">physics flux Φ</text>
  <line x1="910" y1="88" x2="910" y2="196" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/>
  <line x1="931" y1="219" x2="988" y2="219" stroke="#1c2430" stroke-width="2" marker-end="url(#l2ah)"/>
  <text x="905" y="150" text-anchor="end" font-size="11" fill="#0f766e">α=0 ⇒ ×1</text>
  <text x="287" y="272" text-anchor="middle" font-size="11.5" fill="#5d6875">g trained offline — BPTT through a differentiable emulator</text>
</svg>
