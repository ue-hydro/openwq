<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" role="img" aria-label="Attributes feed Layer 1, which outputs per-cell theta into the physics equation Phi; state also feeds Phi; Phi's flux passes through Layer 2, a bounded closure driven by state and attributes, producing the corrected flux.">
  <defs>
    <marker id="oah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2430"/></marker>
    <marker id="oahm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6875"/></marker>
  </defs>
  <rect x="1" y="1" width="1158" height="428" rx="14" fill="#f7f8fa" stroke="#d7dde5"/>
  <rect x="24" y="60" width="150" height="48" rx="9" fill="#eef1f6" stroke="#d7dde5" stroke-width="1.5"/>
  <text x="99" y="89" text-anchor="middle" font-size="12" fill="#1c2430">attributes</text>
  <rect x="24" y="250" width="150" height="48" rx="9" fill="#eef1f6" stroke="#d7dde5" stroke-width="1.5"/>
  <text x="99" y="279" text-anchor="middle" font-size="12" fill="#1c2430">state</text>
  <rect x="290" y="40" width="250" height="88" rx="11" fill="#efe9fd" stroke="#6d28d9" stroke-width="2"/>
  <text x="415" y="68"  text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#6d28d9">LAYER 1 · PARAMETERS</text>
  <text x="415" y="94"  text-anchor="middle" font-size="17" font-weight="600" fill="#1c2430">θ = g(attributes)</text>
  <text x="415" y="116" text-anchor="middle" font-size="12" fill="#5d6875">off → global scalar</text>
  <rect x="290" y="230" width="250" height="88" rx="11" fill="#e3f2ef" stroke="#0f766e" stroke-width="2"/>
  <text x="415" y="258" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#0f766e">PHYSICS</text>
  <text x="415" y="284" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2430">Φ(state, θ)</text>
  <text x="415" y="306" text-anchor="middle" font-size="12" fill="#5d6875">the governing equation</text>
  <rect x="670" y="230" width="278" height="88" rx="11" fill="#fbeeda" stroke="#c2650a" stroke-width="2"/>
  <text x="809" y="258" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1.5" fill="#c2650a">LAYER 2 · FLUX CLOSURE</text>
  <text x="809" y="284" text-anchor="middle" font-size="16" font-weight="600" fill="#1c2430">× (1 + α · g(state, attr))</text>
  <text x="809" y="306" text-anchor="middle" font-size="12" fill="#5d6875">α = 0 → exact physics</text>
  <rect x="1010" y="250" width="126" height="48" rx="9" fill="#eef1f6" stroke="#d7dde5" stroke-width="1.5"/>
  <text x="1073" y="272" text-anchor="middle" font-size="11.5" fill="#1c2430">corrected</text>
  <text x="1073" y="288" text-anchor="middle" font-size="11.5" fill="#1c2430">flux</text>
  <line x1="174" y1="84"  x2="284" y2="84"  stroke="#1c2430" stroke-width="2" marker-end="url(#oah)"/>
  <text x="229" y="76" text-anchor="middle" font-size="12" fill="#5d6875">attributes</text>
  <line x1="174" y1="274" x2="284" y2="274" stroke="#1c2430" stroke-width="2" marker-end="url(#oah)"/>
  <text x="229" y="266" text-anchor="middle" font-size="12" fill="#5d6875">state</text>
  <line x1="415" y1="128" x2="415" y2="226" stroke="#1c2430" stroke-width="2" marker-end="url(#oah)"/>
  <text x="428" y="182" text-anchor="start" font-size="13" font-weight="600" fill="#6d28d9">θ</text>
  <line x1="540" y1="274" x2="666" y2="274" stroke="#1c2430" stroke-width="2" marker-end="url(#oah)"/>
  <text x="603" y="266" text-anchor="middle" font-size="12" fill="#5d6875">Φ · flux</text>
  <line x1="948" y1="274" x2="1006" y2="274" stroke="#1c2430" stroke-width="2" marker-end="url(#oah)"/>
  <text x="977" y="266" text-anchor="middle" font-size="12" fill="#5d6875">y</text>
  <path d="M99 298 L99 384 L809 384 L809 322" fill="none" stroke="#5d6875" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#oahm)"/>
  <text x="454" y="378" text-anchor="middle" font-size="12" fill="#5d6875">state + attributes</text>
</svg>
